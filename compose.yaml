name: bing-rewards-stack

services:
  ms-rewards:
    image: bing-rewards-backend:${STACK_VERSION:-local}
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    shm_size: 1gb
    env_file: .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      API_MODE: "true"
      API_HOST: 0.0.0.0
      API_PORT: "3010"
      RUN_ON_START: "false"
      CRON_SCHEDULE: ""
      API_ALLOW_CONFIG_WRITE: "true"
      API_ALLOW_CONFIG_REVEAL: "false"
      API_ALLOW_SCHEDULE_WRITE: "false"
      API_ALLOW_ENV_OVERRIDES: "true"
    dns:
      - ${DNS_PRIMARY:-223.5.5.5}
      - ${DNS_SECONDARY:-119.29.29.29}
    volumes:
      - ./config:/usr/src/microsoft-rewards-script/config
      - ./data:/usr/src/microsoft-rewards-script/data
      - ./logs:/usr/src/microsoft-rewards-script/logs
      - ./browser_data:/usr/src/microsoft-rewards-script/browser_data
      - ./sessions:/usr/src/microsoft-rewards-script/sessions
    healthcheck:
      test: ["CMD", "sh", "scripts/docker/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  rewards-dashboard:
    image: bing-rewards-dashboard:${STACK_VERSION:-local}
    build:
      context: ./dashboard
    restart: unless-stopped
    init: true
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1}:${DASHBOARD_PORT:-8890}:8890"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      CONTROL_API_URL: http://ms-rewards:3010
      CONTROL_API_TOKEN: ${API_TOKEN:?Run bash scripts/init.sh first}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:?Set DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?Set DASHBOARD_PASSWORD}
      DASHBOARD_TITLE: 必应积分
      POLL_MS: "5000"
      LOG_REPLAY: "300"
      DATA_DIR: /data
    volumes:
      - ./dashboard-data:/data
    depends_on:
      ms-rewards:
        condition: service_healthy
    labels:
      com.centurylinklabs.watchtower.enable: "false"

networks:
  default:
    enable_ipv6: false
